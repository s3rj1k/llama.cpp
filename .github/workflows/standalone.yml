name: standalone

# Builds self-contained, statically-linked unified `llama` binaries for
# macOS arm64 (BoringSSL + Metal) and Linux x86_64 (BoringSSL + AVX-512),
# then publishes both to a combined GitHub Pages index.
#
# macOS: no dylibs outside Apple system frameworks; Metal shader library
# embedded; KleidiAI CPU kernels; targets armv8.7-a with -mcpu=apple-m3.
#
# Linux: libstdc++ and libgcc statically linked; only glibc system libs
# (libc.so, libm.so) remain as runtime deps; targets icelake-server level
# AVX-512 (F/CD/VL/DQ/BW + VBMI + VNNI + BF16).

on:
  workflow_dispatch:
  push:
    branches:
      - self-signed-cert

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=ON \
            -DLLAMA_LLGUIDANCE=ON \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DGGML_LTO=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.7-a+dotprod+fp16+i8mm+bf16 \
            -DCMAKE_C_FLAGS=-mcpu=apple-m3 \
            -DCMAKE_CXX_FLAGS=-mcpu=apple-m3 \
            -DCMAKE_ASM_FLAGS=-mcpu=apple-m3 \
            -DGGML_CUDA=OFF \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_CPU_KLEIDIAI=ON

      - name: Build llama
        run: |
          time cmake --build build --config Release -j $(sysctl -n hw.logicalcpu) --target llama-app

      - name: Verify self-contained binary
        run: |
          # Confirm no @rpath/@loader_path dylib dependencies leaked in -- only
          # Apple system libraries (/usr/lib/*, /System/Library/*) are allowed.
          deps=$(otool -L build/bin/llama | tail -n +2 | awk '{print $1}')
          echo "$deps"
          bad=$(printf '%s\n' "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::llama has non-system dylib dependencies:"
            echo "$bad"
            exit 1
          fi
          # Run from an unrelated directory to prove the binary is relocatable.
          mkdir -p /tmp/relocation-check
          cp build/bin/llama /tmp/relocation-check/
          /tmp/relocation-check/llama help all >/dev/null

      - name: Verify SSL linkage
        run: |
          otool -L build/bin/llama | grep -E "ssl|crypto" || true
          build/bin/llama serve --help 2>&1 | grep -iE "ssl-(key|cert|san|valid)" | head -10

      - name: Upload llama (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: llama-macos-arm64
          path: build/bin/llama
          if-no-files-found: error
          retention-days: 1

  build-linux-avx512:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_FLAGS="-static-libgcc" \
            -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=ON \
            -DLLAMA_LLGUIDANCE=ON \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DGGML_LTO=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_F16C=ON \
            -DGGML_FMA=ON \
            -DGGML_BMI2=ON \
            -DGGML_AVX512=ON \
            -DGGML_AVX512_VBMI=ON \
            -DGGML_AVX512_VNNI=ON \
            -DGGML_AVX512_BF16=ON

      - name: Build llama
        run: |
          time cmake --build build --config Release -j $(nproc) --target llama-app

      - name: Verify self-contained binary
        run: |
          # Confirm no unexpected .so dependencies leaked in -- only standard
          # glibc system libraries (libc.so, libm.so, ld-linux) are allowed.
          ldd build/bin/llama
          bad=$(ldd build/bin/llama | grep -v 'statically linked' \
                | grep -vE '(linux-vdso|libm\.so|libc\.so|libpthread\.so|libdl\.so|librt\.so|libgomp\.so|ld-linux)' \
                | grep '\.so' || true)
          if [ -n "$bad" ]; then
            echo "::error::llama has non-system .so dependencies:"
            echo "$bad"
            exit 1
          fi
          # Run from an unrelated directory to prove the binary is relocatable.
          # Skipped when the runner has no AVX-512 to avoid SIGILL.
          if grep -q avx512f /proc/cpuinfo; then
            mkdir -p /tmp/relocation-check
            cp build/bin/llama /tmp/relocation-check/
            /tmp/relocation-check/llama help all >/dev/null
          fi

      - name: Verify SSL linkage
        run: |
          build/bin/llama serve --help 2>&1 | grep -iE "ssl-(key|cert|san|valid)" | head -10

      - name: Upload llama (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: llama-linux-x86_64-avx512
          path: build/bin/llama
          if-no-files-found: error
          retention-days: 1

  stage:
    needs: [build-macos, build-linux-avx512]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: llama-macos-arm64
          path: artifacts/macos-arm64

      - name: Download Linux AVX-512 binary
        uses: actions/download-artifact@v4
        with:
          name: llama-linux-x86_64-avx512
          path: artifacts/linux-x86_64-avx512

      - name: Stage Pages content
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA:  ${{ github.sha }}
          GH_REF:  ${{ github.ref_name }}
        run: |
          mkdir -p pages-out/macos-arm64
          mkdir -p pages-out/linux-x86_64-avx512

          chmod +x artifacts/macos-arm64/llama artifacts/linux-x86_64-avx512/llama

          cp artifacts/macos-arm64/llama         pages-out/macos-arm64/llama
          cp artifacts/linux-x86_64-avx512/llama pages-out/linux-x86_64-avx512/llama

          sha256sum pages-out/macos-arm64/llama         > pages-out/macos-arm64/llama.sha256
          sha256sum pages-out/linux-x86_64-avx512/llama > pages-out/linux-x86_64-avx512/llama.sha256

          cat > pages-out/index.html <<HTMLEOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>llama -- standalone builds</title>
          <style>
            :root { color-scheme: light dark; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 640px; margin: 2em auto; padding: 0 1em 3em; line-height: 1.5; }
            h1 { font-size: 1.4em; margin: 0 0 0.3em; }
            h2 { font-size: 1em; margin: 1.6em 0 0.4em; }
            p, ul { margin: 0.4em 0; }
            ul { padding-left: 1.2em; }
            code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88em; background: rgba(127,127,127,0.15); padding: 0.1em 0.3em; border-radius: 3px; }
            pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88em; background: rgba(127,127,127,0.1); border: 1px solid rgba(127,127,127,0.25); padding: 0.7em 1em; border-radius: 5px; overflow-x: auto; }
            pre code { background: none; padding: 0; }
            a { color: #0a66c2; text-decoration: none; }
            a:hover { text-decoration: underline; }
            @media (prefers-color-scheme: dark) { a { color: #6cb6ff; } }
            .meta { color: #888; font-size: 0.88em; }
          </style>
          </head>
          <body>
          <h1>llama -- standalone builds</h1>
          <p class="meta">commit <a href="https://github.com/${GH_REPO}/commit/${GH_SHA}"><code>${GH_SHA}</code></a> &middot; <code>${GH_REF}</code></p>

          <h2>macOS arm64 -- M3+, Metal</h2>
          <p>Requires Apple M3 or later. No dylibs; Metal shaders embedded.</p>
          <ul>
            <li><a href="macos-arm64/llama">macos-arm64/llama</a> &middot; <a href="macos-arm64/llama.sha256">sha256</a></li>
          </ul>
          <pre>chmod +x llama && xattr -d com.apple.quarantine llama</pre>

          <h2>Linux x86_64 -- AVX-512 (Ice Lake+)</h2>
          <p>Requires AVX-512F/VBMI/VNNI/BF16 (Ice Lake / Zen 4 or later). Runtime deps: glibc, libgomp.</p>
          <ul>
            <li><a href="linux-x86_64-avx512/llama">linux-x86_64-avx512/llama</a> &middot; <a href="linux-x86_64-avx512/llama.sha256">sha256</a></li>
          </ul>
          <pre>chmod +x llama</pre>

          <h2>Usage</h2>
          <pre>./llama serve --help
          ./llama cli   --help
          ./llama help  all</pre>

          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-out

  deploy:
    needs: stage
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
